name: Start Exercise

# Shared exercise workflow: identical in every exercise repo. It is maintained
# centrally and copied into each repo, so don't edit it per repo. Module-specific
# values come in as inputs from 0-start-exercise.yml. The filename must not start
# with a digit, so Step 0 doesn't disable it.

on:
  workflow_call:
    inputs:
      module-title:
        description: 'Module title, used in the exercise issue, welcome message and README'
        required: true
        type: string
      intro-message:
        description: 'One-sentence module introduction for the welcome message'
        required: true
        type: string

env:
  STEP_1_FILE: ".github/steps/1-step.md"
  MODULE_TITLE: ${{ inputs.module-title }}
  INTRO_MESSAGE: ${{ inputs.intro-message }}

jobs:
  disable_workflows:
    if: |
      !github.event.repository.is_template
    name: Disable exercise workflows
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Disable all exercise workflows
        run: |
          # Find all numbered workflow files except Step 1. Step 1 is safe to leave
          # enabled because its path filter only matches learner work and its
          # check_initial_commit job no-ops on the bootstrap commit. Keeping it enabled
          # avoids depending on GitHub's workflow-catalog indexing after repo creation.
          workflows=$(git ls-files | grep -E '^\.github/workflows/[0-9].*\.(yml|yaml)$' | grep -vE '^\.github/workflows/1-')
          for workflow in $workflows; do
            workflow_name="$(basename "$workflow")"
            echo "Disabling workflow: $workflow_name"
            gh workflow disable "$workflow_name" || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create_exercise:
    name: Create exercise issue and update README
    runs-on: ubuntu-latest

    outputs:
      issue-url: ${{ steps.create-issue.outputs.ISSUE_URL }}
      issue-number: ${{ steps.create-issue.outputs.ISSUE_NUMBER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build welcome message from local template
        id: build-welcome-message
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            // Relative image links (../images/*, ../../images/*) don't resolve in issue
            // comments, so point them at the default branch. Done at render time,
            // so nothing has to be committed to main.
            const imageBase = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${context.payload.repository.default_branch}/.github/images/`;
            const fixImages = (text) => text.replace(/(?:\.\.\/)+images\/([^\s)"']+)/g, (_, file) => `${imageBase}${file}?raw=true`);
            const vars = {
              title: process.env.MODULE_TITLE,
              login: context.actor,
              intro_message: process.env.INTRO_MESSAGE
            };
            let text = fs.readFileSync('.github/markdown-templates/exercise/welcome.md', 'utf8');
            for (const [key, value] of Object.entries(vars)) {
              text = text.replaceAll(`{{ ${key} }}`, value);
            }
            core.setOutput('updated-text', fixImages(text));

      - name: Create issue with welcome message
        id: create-issue
        uses: actions/github-script@v8
        with:
          script: |
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Exercise: ${process.env.MODULE_TITLE}`,
              body: process.env.ISSUE_BODY
            });
            core.setOutput('ISSUE_URL', issue.html_url);
            core.setOutput('ISSUE_NUMBER', issue.number);
        env:
          ISSUE_BODY: ${{ steps.build-welcome-message.outputs.updated-text }}

      - name: Build new README from local template
        id: build-new-readme
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            // Relative image links (../images/*, ../../images/*) don't resolve in issue
            // comments, so point them at the default branch. Done at render time,
            // so nothing has to be committed to main.
            const imageBase = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${context.payload.repository.default_branch}/.github/images/`;
            const fixImages = (text) => text.replace(/(?:\.\.\/)+images\/([^\s)"']+)/g, (_, file) => `${imageBase}${file}?raw=true`);
            const vars = {
              title: process.env.MODULE_TITLE,
              login: context.actor,
              issue_url: process.env.ISSUE_URL
            };
            let text = fs.readFileSync('.github/markdown-templates/readme/exercise-started.md', 'utf8');
            for (const [key, value] of Object.entries(vars)) {
              text = text.replaceAll(`{{ ${key} }}`, value);
            }
            core.setOutput('updated-text', fixImages(text));
        env:
          ISSUE_URL: ${{ steps.create-issue.outputs.ISSUE_URL }}

      - name: Overwrite README
        env:
          README_TEXT: ${{ steps.build-new-readme.outputs.updated-text }}
        run: echo "$README_TEXT" > README.md

      # Best effort: the README is cosmetic, and orgs that require pull requests on
      # main (repository rulesets) reject the bot's push. The exercise works either way.
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Start exercise"
            git push || echo "::warning title=README not updated::Could not push to the default branch (a ruleset probably requires pull requests). The exercise continues in the issue; the README keeps its original text."
          fi

  post_next_step_content:
    name: Post next step content
    runs-on: ubuntu-latest
    needs: [create_exercise]
    env:
      ISSUE_NUMBER: ${{ needs.create_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Create comment - add step content
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            // Relative image links (../images/*, ../../images/*) don't resolve in issue
            // comments, so point them at the default branch. Done at render time,
            // so nothing has to be committed to main.
            const imageBase = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${context.payload.repository.default_branch}/.github/images/`;
            const fixImages = (text) => text.replace(/(?:\.\.\/)+images\/([^\s)"']+)/g, (_, file) => `${imageBase}${file}?raw=true`);
            let body = fixImages(fs.readFileSync(process.env.STEP_1_FILE, 'utf8'));
            body = body.replaceAll('{{ login }}', context.actor);
            body = body.replaceAll('{{ full_repo_name }}', `${context.repo.owner}/${context.repo.repo}`);

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body
            });
